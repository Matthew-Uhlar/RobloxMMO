name: Publish Roblox place
on:
  push:
    branches: [main]
    paths:
      - '*.lua'
      - 'default.project.json'
      - 'art/**'
      - '!art/**/*.md'
  workflow_dispatch:
    inputs:
      confirm_place_id:
        description: 'Type 73453386951995 to publish this revision'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: roblox-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 20
    environment: roblox-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate configured target
        shell: pwsh
        env:
          UNIVERSE_ID: '10777817254'
          PLACE_ID: '73453386951995'
          CONFIRM_PLACE_ID: ${{ inputs.confirm_place_id }}
        run: |
          if ($env:UNIVERSE_ID -notmatch '^[1-9][0-9]{0,15}$' -or $env:PLACE_ID -notmatch '^[1-9][0-9]{0,15}$') { throw 'Invalid configured destination IDs.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:CONFIRM_PLACE_ID -cne $env:PLACE_ID) { throw 'Place confirmation does not match configured target.' }
      - name: Install pinned tools
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install-tools.ps1
      - name: Test and build this revision
        shell: pwsh
        run: ./build.ps1 -ToolDirectory "$PWD/.tools"
      - name: Validate release scripts
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1
          ./.tools/lune.exe run scripts/verify-workflows.luau
          if ($LASTEXITCODE -ne 0) { throw 'Workflow verification failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Roblox-publish-${{ github.sha }}
          path: Aether-Isles.rbxl
          if-no-files-found: error
      - name: Publish and verify asynchronous operation
        shell: pwsh
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: '10777817254'
          PLACE_ID: '73453386951995'
        run: ./scripts/publish.ps1 -UniverseId $env:UNIVERSE_ID -PlaceId $env:PLACE_ID
      - name: Preserve operation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Roblox-receipt-${{ github.run_id }}
          path: publish-receipt.json
          if-no-files-found: ignore

