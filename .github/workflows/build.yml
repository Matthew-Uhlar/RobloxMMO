name: Build and verify
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned tools
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install-tools.ps1
      - name: Test and build place
        shell: pwsh
        run: ./build.ps1 -ToolDirectory "$PWD/.tools"
      - name: Validate release scripts
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1
          ./.tools/lune.exe run scripts/verify-workflows.luau
          if ($LASTEXITCODE -ne 0) { throw 'Workflow verification failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Aether-Isles-${{ github.sha }}
          path: Aether-Isles.rbxl
          if-no-files-found: error
          retention-days: 30


